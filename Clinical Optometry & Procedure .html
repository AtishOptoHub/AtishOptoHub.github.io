        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 300px;
            background-color: #1e293b;
            color: #fff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .nav-item {
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            background-color: #334155;
        }

        .nav-item.active {
            background-color: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background-color: #ffffff;
        }

        .topic-card {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            animation: fadeIn 0.3s ease-in-out;
            padding-bottom: 50px;
        }

        .topic-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1.test-title {
            font-size: 1.8rem;

            border-bottom: 3px solid #0284c7;
            padding-bottom: 8px;
        }

        h2 {
            color: #0077b6;
            font-size: 1.3rem;
            margin-top: 25px;
            margin-bottom: 12px;
            background: #e0f2fe;
            padding: 8px 15px;
            border-left: 5px solid #0077b6;
            border-radius: 4px;
        }

        h3 {
            color: #1e293b;

        }

        .section-title {

            line-height: 1.5;
            color: #334155;
        }

        p {
            line-height: 1.6;
            margin-bottom: 12px;
            color: #334155;
        }

        .bold {
            font-weight: bold;
        }
